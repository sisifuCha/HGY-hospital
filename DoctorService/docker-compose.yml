version: '3.8'

services:
  doctor-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctor-service
    ports:
      - "8081:8081"
    environment:
      # 数据库配置（连接宿主机的数据库）
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:63333/hospital_new
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=HGY25qiu@shixun
      
      # Redis配置（连接宿主机的Redis）
      - SPRING_DATA_REDIS_HOST=host.docker.internal
      - SPRING_DATA_REDIS_PORT=6379
      
      # CORS配置
      - SPRING_WEB_CORS_ALLOWED_ORIGINS=http://localhost:5173
      
      # JVM配置
      - JAVA_OPTS=-Xms256m -Xmx512m
    restart: unless-stopped
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  hospital-network:
    driver: bridge
