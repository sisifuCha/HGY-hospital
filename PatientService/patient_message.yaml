openapi: 3.0.0
info:
  title: Hospital Patient Service API
  description: 医院患者服务 API 文档，包含消息推送和挂号功能。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发服务器

paths:
  /api/patients/{patientId}/messages:
    post:
      summary: 获取并处理患者未读消息
      description: 获取指定患者的未读消息列表。注意：此操作会将获取到的消息在服务端标记为"已发送"(sent)，因此使用 POST 方法。
      parameters:
        - name: patientId
          in: path
          required: true
          description: 患者的唯一标识 ID
          schema:
            type: string
            example: "12345"
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
              examples:
                hasMessages:
                  summary: 有新消息
                  value:
                    code: 200
                    message: "success"
                    data:
                      status: true
                      messages:
                        - title: "预约成功"
                        - content: "您的预约已成功，请准时就诊。"
                        - timestamp: "2025-12-11T10:00:00Z"
                noMessages:
                  summary: 无新消息
                  value:
                    code: 200
                    message: "success"
                    data:
                      status: false
                      messages: []

  /api/registrations:
    post:
      summary: 创建挂号请求
      description: 患者发起挂号请求，锁定排班资源。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationRequest'
            examples:
              simpleRegistration:
                summary: 普通挂号请求
                value:
                  patientId: "P12345"
                  scheduleRecordId: "SCH001"
                  confirm: true
      responses:
        '200':
          description: 挂号成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
              examples:
                success:
                  summary: 挂号成功响应
                  value:
                    code: 200
                    message: "success"
                    data:
                      patientId: "PAT0001"
                      scheduleRecordId: "SCH7890"
                      registerTime: "2025-11-15 09:30:12"
                      status: true

components:
  schemas:
    # 通用响应结构
    ApiResponseMessage:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "success"
        data:
          $ref: '#/components/schemas/MessageResponseData'

    ApiResponseRegistration:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "success"
        data:
          $ref: '#/components/schemas/RegistrationDto'

    # 消息相关 Schema
    MessageResponseData:
      type: object
      properties:
        status:
          type: boolean
          description: 指示本次请求是否获取到了新消息
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageItem'
    
    MessageItem:
      type: object
      properties:
        title:
          type: string
          description: 消息标题
        content:
          type: string
          description: 消息内容
        timestamp:
          type: string
          description: 消息创建时间 (ISO 8601)

    # 挂号相关 Schema
    CreateRegistrationRequest:
      type: object
      required:
        - patientId
        - scheduleRecordId
      properties:
        patientId:
          type: string
          description: 患者ID
        scheduleRecordId:
          type: string
          description: 排班记录ID
        confirm:
          type: boolean
          description: 是否确认挂号（默认为 true）
          default: true

    RegistrationDto:
      type: object
      properties:
        patientId:
          type: string
        scheduleRecordId:
          type: string
        registerTime:
          type: string
          description: 挂号时间
        status:
          type: string
          description: 挂号状态
