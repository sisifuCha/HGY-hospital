openapi: 3.0.1
info:
  title: HGY Patient Service API
  version: 2.0.0
  description: >
    红果园校医院患者端 API，覆盖挂号、候补、评价、身份认证、消息提醒、智能导诊、地理导航等能力。
servers:
  - url: http://localhost:8082
    description: PatientService 本地实例
security:
  - bearerAuth: []
paths:
  /user/register:
    post:
      summary: 患者注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkString'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /user/login:
    post:
      summary: 患者登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /user/patient-id:
    get:
      summary: 根据账号获取患者ID
      parameters:
        - in: query
          name: account
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/OkString'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/identity/verification:
    post:
      summary: 提交实名身份认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityVerificationRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /api/identity/verification/{patientId}:
    get:
      summary: 查询实名认证状态
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 状态信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVerificationStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/departments:
    get:
      summary: 获取科室树
      responses:
        '200':
          description: 科室列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDepartmentList'
  /api/registration/doctors:
    get:
      summary: 按科室和日期获取医生排班
      parameters:
        - in: query
          name: departmentId
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 医生排班列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDoctorSchedules'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/doctors/{doctorId}:
    get:
      summary: 医生详情
      parameters:
        - in: path
          name: doctorId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 医生信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDoctor'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registrations:
    post:
      summary: 创建挂号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
    get:
      summary: 分页查询挂号
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
        - in: query
          name: date
          schema:
            type: string
            format: date
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationPage'
    delete:
      summary: 取消挂号
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
        - in: query
          name: scheduleRecordId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registrations/by-key:
    get:
      summary: 按复合键查询挂号
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
        - in: query
          name: scheduleRecordId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
  /api/registrations/{registrationId}:
    get:
      summary: 按注册ID查询挂号
      parameters:
        - in: path
          name: registrationId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registrations/{registrationId}/feedback:
    post:
      summary: 提交就诊评价
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFeedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: 查看就诊评价
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFeedback'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/registrations/waiting:
    post:
      summary: 创建候补
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitingRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWaiting'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: 按排班查看候补队列
      parameters:
        - in: query
          name: scheduleRecordId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWaitingList'
    delete:
      summary: 取消候补
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
        - in: query
          name: waitingId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWaiting'
  /api/registrations/waiting/patient:
    get:
      summary: 按患者查看候补
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWaitingList'
  /api/registrations/waiting/confirm:
    post:
      summary: 候补确认
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                waitingId:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWaiting'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/patients/{patientId}/profile:
    post:
      summary: 上传/更新患者档案
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientProfile'
      responses:
        '200':
          $ref: '#/components/responses/OkString'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: 查询患者档案
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProfile'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/patients/{patientId}/messages:
    post:
      summary: 拉取未发送消息
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessageList'
  /api/patients/{patientId}/notification-settings:
    get:
      summary: 获取消息偏好
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNotificationSetting'
    put:
      summary: 更新消息偏好
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkString'
  /api/triage/suggestions:
    post:
      summary: 智能导诊建议
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTriage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/triage/history:
    get:
      summary: 导诊历史
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTriageList'
  /api/navigation/locations:
    get:
      summary: 获取院区与诊室坐标
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLocations'
  /api/navigation/routes:
    post:
      summary: 生成院区导航路线
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationRouteRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    OkString:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseString'
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Conflict:
      description: 业务冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Locked:
      description: 资源锁定
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
  schemas:
    ApiResponseString:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: string
    ApiResponseToken:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            token:
              type: string
    ApiResponseError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
    ApiResponseDepartmentList:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'
    ApiResponseDoctorSchedules:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DoctorWithSchedules'
    ApiResponseDoctor:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Doctor'
    ApiResponseRegistration:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/RegistrationDto'
    ApiResponseRegistrationPage:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/RegistrationPage'
    ApiResponseFeedback:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/FeedbackDto'
    ApiResponseWaiting:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/WaitingDto'
    ApiResponseWaitingList:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/WaitingDto'
    ApiResponseProfile:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/PatientProfile'
    ApiResponseMessageList:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/MessageResponse'
    ApiResponseNotificationSetting:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/NotificationSetting'
    ApiResponseVerification:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/IdentityVerificationResponse'
    ApiResponseVerificationStatus:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/IdentityVerificationStatus'
    ApiResponseTriage:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/TriageResponse'
    ApiResponseTriageList:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/TriageResponse'
    ApiResponseLocations:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/LocationResponse'
    ApiResponseRoute:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/NavigationRoute'
    RegisterRequest:
      type: object
      required: [userAccount, userPassword, userName, identificationId]
      properties:
        userAccount:
          type: string
        userPassword:
          type: string
        userName:
          type: string
        userGender:
          type: string
        userEmail:
          type: string
        userPhone:
          type: string
        birthday:
          type: string
          format: date
        identificationId:
          type: string
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
        password:
          type: string
    IdentityVerificationRequest:
      type: object
      required: [patientId, name, idNumber, idFrontImage, idBackImage]
      properties:
        patientId:
          type: string
        name:
          type: string
        idNumber:
          type: string
        idFrontImage:
          type: string
        idBackImage:
          type: string
        faceSnapshot:
          type: string
        extra:
          type: object
    IdentityVerificationResponse:
      type: object
      properties:
        verificationId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        submitTime:
          type: string
          format: date-time
    IdentityVerificationStatus:
      type: object
      properties:
        patientId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        approvedBy:
          type: string
          nullable: true
        approvedTime:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
    Department:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subDepartments:
          type: array
          items:
            $ref: '#/components/schemas/SubDepartment'
    SubDepartment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    DoctorWithSchedules:
      type: object
      properties:
        doctorId:
          type: string
        doctorName:
          type: string
        doctorTitle:
          type: string
        specialty:
          type: string
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleDto'
    Doctor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        docTitleId:
          type: string
        specialty:
          type: string
        details:
          type: string
        departId:
          type: string
        clinicId:
          type: string
        status:
          type: string
    ScheduleDto:
      type: object
      properties:
        scheduleId:
          type: string
        timePeriodName:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        registrationFee:
          type: number
        leftSourceCount:
          type: integer
    CreateRegistrationRequest:
      type: object
      required: [patientId, scheduleRecordId]
      properties:
        patientId:
          type: string
        scheduleRecordId:
          type: string
        confirm:
          type: boolean
          default: true
    RegistrationDto:
      type: object
      properties:
        registrationId:
          type: string
        patientId:
          type: string
        scheduleRecordId:
          type: string
        doctorId:
          type: string
        doctorName:
          type: string
        departmentId:
          type: string
        departmentName:
          type: string
        clinicId:
          type: string
        clinicName:
          type: string
        scheduleDate:
          type: string
          format: date
        timePeriodName:
          type: string
        status:
          type: string
          enum: [预约中, 已预约, 已取消, 已过期, 已就诊]
        paymentStatus:
          type: string
        registerTime:
          type: string
          format: date-time
        canCancel:
          type: boolean
    RegistrationPage:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationDto'
    FeedbackRequest:
      type: object
      required: [patientId, score]
      properties:
        patientId:
          type: string
        score:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
        comment:
          type: string
    FeedbackDto:
      type: object
      properties:
        registrationId:
          type: string
        score:
          type: integer
        tags:
          type: array
          items:
            type: string
        comment:
          type: string
        createdTime:
          type: string
          format: date-time
    WaitingRequest:
      type: object
      required: [patientId, scheduleRecordId]
      properties:
        patientId:
          type: string
        scheduleRecordId:
          type: string
    WaitingDto:
      type: object
      properties:
        waitingId:
          type: string
        patientId:
          type: string
        scheduleRecordId:
          type: string
        status:
          type: string
          enum: [排队中, 已转正, 已取消, 已过期]
        applyTime:
          type: string
          format: date-time
        position:
          type: integer
        limitCount:
          type: integer
    PatientProfile:
      type: object
      properties:
        patientId:
          type: string
        name:
          type: string
        gender:
          type: string
        birthDate:
          type: string
          format: date
        phone:
          type: string
        address:
          type: string
        medicalHistory:
          type: string
        allergies:
          type: string
    MessageResponse:
      type: object
      properties:
        status:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageDto'
    MessageDto:
      type: object
      properties:
        messageId:
          type: string
        title:
          type: string
        content:
          type: string
        category:
          type: string
          enum: [REGISTRATION, PAYMENT, WAITING, TRIAGE, SYSTEM]
        timestamp:
          type: string
          format: date-time
    NotificationSettingRequest:
      type: object
      properties:
        channels:
          type: array
          items:
            type: string
            enum: [APP, SMS, EMAIL]
        quietPeriod:
          type: object
          properties:
            start:
              type: string
            end:
              type: string
        remindBeforeMinutes:
          type: integer
    NotificationSetting:
      allOf:
        - $ref: '#/components/schemas/NotificationSettingRequest'
        - type: object
          properties:
            updatedTime:
              type: string
              format: date-time
    TriageRequest:
      type: object
      required: [patientId, symptoms]
      properties:
        patientId:
          type: string
        symptoms:
          type: array
          items:
            type: string
        durationDays:
          type: integer
        temperature:
          type: number
        allergies:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [rule, ml, hybrid]
          default: hybrid
    TriageResponse:
      type: object
      properties:
        triageId:
          type: string
        patientId:
          type: string
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/TriageRecommendation'
        suggestedActions:
          type: array
          items:
            type: string
        createdTime:
          type: string
          format: date-time
    TriageRecommendation:
      type: object
      properties:
        departmentId:
          type: string
        departmentName:
          type: string
        confidence:
          type: number
        reason:
          type: string
    LocationResponse:
      type: object
      properties:
        campuses:
          type: array
          items:
            $ref: '#/components/schemas/Campus'
    Campus:
      type: object
      properties:
        campusId:
          type: string
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        floors:
          type: array
          items:
            $ref: '#/components/schemas/Floor'
    Floor:
      type: object
      properties:
        floor:
          type: string
        clinics:
          type: array
          items:
            $ref: '#/components/schemas/ClinicLocation'
    ClinicLocation:
      type: object
      properties:
        clinicId:
          type: string
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    NavigationRouteRequest:
      type: object
      required: [patientId, origin, destinationClinicId]
      properties:
        patientId:
          type: string
        origin:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        destinationClinicId:
          type: string
        prefer:
          type: string
          enum: [indoor, outdoor, mixed]
          default: mixed
        needAccessibility:
          type: boolean
          default: false
    NavigationRoute:
      type: object
      properties:
        campusId:
          type: string
        distanceMeters:
          type: integer
        etaMinutes:
          type: integer
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RouteStep'
    RouteStep:
      type: object
      properties:
        type:
          type: string
          enum: [outdoor, indoor, elevator, stairs]
        instruction:
          type: string
        distanceMeters:
          type: integer
    ApiResponseRoute:
      $ref: '#/components/schemas/ApiResponseRoute'
