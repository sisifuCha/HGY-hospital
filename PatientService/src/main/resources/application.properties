server.port=8082

spring.application.name=PatientService

spring.datasource.url=jdbc:postgresql://localhost:63333/hospital_new
spring.datasource.username=root
spring.datasource.password=HGY25qiu@shixun
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# SQL related configuration
spring.jpa.show-sql=false

# Logging level configuration
logging.level.root=info
logging.level.com.example.Service.RegistrationServiceImpl=info

mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.example.pojo.entity

# Redis config
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Email verification
# - SMTP real sending is controlled by patient.emailVerification.realSendEnabled
# - Storage: Redis (code + cooldown)
patient.emailVerification.expireSeconds=300
patient.emailVerification.sendCooldownSeconds=60
patient.emailVerification.realSendEnabled=true
patient.emailVerification.redisKeyPrefix=email:verify:

# SMTP (put real credentials in application-local.properties; do NOT commit secrets)
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
# From display email (optional; fallback to spring.mail.username)
patient.emailVerification.from=

# Import local secrets (optional)
spring.config.import=optional:classpath:application-local.properties
