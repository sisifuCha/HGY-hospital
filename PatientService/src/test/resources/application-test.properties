# 测试环境：关闭 SSH 隧道，避免端口占用导致上下文启动失败
patient.sshTunnel.enabled=false

# 测试环境：如果本机没启动 redis，禁用 redis repository（避免 redisKeyValueAdapter 创建失败）
spring.data.redis.repositories.enabled=false

# 测试环境：禁用消息定时任务（需要 MessageTaskService 配合 @ConditionalOnProperty，见代码修改）
patient.message.task.enabled=false

# 支付超时扫描：测试时不跑定时器
patient.payment.timeoutScanDelayMs=600000

