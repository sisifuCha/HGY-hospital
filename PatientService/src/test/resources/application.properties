# Test defaults: disable SSH tunnel + Redis repos to keep Spring context stable without external deps
patient.sshTunnel.enabled=false
spring.data.redis.repositories.enabled=false
patient.message.task.enabled=false

# Payment timeout scan: do not run scheduled task in tests
patient.payment.timeoutScanDelayMs=600000

# --- datasource for tests (H2 in-memory, only for context bootstrap) ---
spring.datasource.url=jdbc:h2:mem:patient_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none

# Email verification: never send real emails in tests
patient.emailVerification.realSendEnabled=false
