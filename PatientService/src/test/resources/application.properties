# 统一测试缺省：关闭 SSH 隧道与 Redis 仓库，避免无 Redis/端口占用时 Spring Context fail
patient.sshTunnel.enabled=false
spring.data.redis.repositories.enabled=false
patient.message.task.enabled=false

# 支付超时扫描：测试时不跑定时器
patient.payment.timeoutScanDelayMs=600000

# --- datasource for tests (H2 in-memory, only for context bootstrap) ---
spring.datasource.url=jdbc:h2:mem:patient_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
